# This command creates a new feature module with full CRUD functionality for an EXISTING model.
# Usage: /create-crud

description = "Create CRUD (schemas, service, router) for an existing SQLModel with PAGINATION support."

args = [
  { name = "module_path", description = "The path to the module directory (e.g., 'app/modules/cameras')." }
]

prompt = """
We're going to create CRUD functionality for an existing model in the module: **{{module_path}}**.

## Goal
Generate `schemas.py`, `service.py`, and `router.py` based on the model defined in `{{module_path}}/models.py`, including a **paginated list** endpoint.

## Process
1.  **Analyze Module**:
    - Identify the **module name** from the path (e.g., `cameras` from `app/modules/cameras`).
    - Read `{{module_path}}/models.py` to identify the main **resource name** (e.g., `Camera`) and its fields.
2.  **Generate `schemas.py`**:
    - Create `Read`, `Create`, and `Update` schemas in `{{module_path}}/schemas.py`.
    - Import `Page` from `app.schemas.common`.
    - Import the Base model from `.models`.
3.  **Generate `service.py`**:
    - Implement `create`, `get`, `list` (paginated), `update`, and `delete` in `{{module_path}}/service.py`.
    - Use the identified resource name for function names (e.g., `create_camera`).
4.  **Generate `router.py`**:
    - Define FastAPI endpoints in `{{module_path}}/router.py`.
    - The `list` endpoint must use pagination (`Page` schema).
5.  **Integration**:
    - Register the router in `app/main.py`.

## Rules
- **Consistency**: Follow the style and naming conventions found in the project.
- **Automation**: Use the resource name found in `models.py` consistently across all files.
- **Pagination**: Always implement the list endpoint with pagination using `app.schemas.common.Page`.

Start by reading `{{module_path}}/models.py`.
"""
